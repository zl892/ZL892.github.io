<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的背单词 · 管理版</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            margin: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .tab-buttons {
            text-align: center;
            margin: 20px 0;
        }

            .tab-buttons button {
                padding: 10px 20px;
                margin: 0 5px;
                border: none;
                background: #e0e6ed;
                border-radius: 20px;
                cursor: pointer;
                font-size: 16px;
            }

                .tab-buttons button.active {
                    background: #3498db;
                    color: white;
                }

        .section {
            display: none;
        }

            .section.active {
                display: block;
            }

        .add-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

            .add-form input, .add-form select {
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 16px;
            }

                .add-form input[type="text"] {
                    flex: 1 1 120px;
                }

            .add-form select {
                flex: 0 0 100px;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            color: #555;
        }

        .play-btn {
            cursor: pointer;
            background: #27ae60;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .delete-btn {
            cursor: pointer;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-left: 5px;
        }

        .category-badge {
            background: #dfe6e9;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #2d3436;
        }

        .card {
            text-align: center;
            background: #f0f8ff;
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
        }

            .card #random-word {
                font-size: 42px;
                font-weight: bold;
                margin: 10px 0;
            }

            .card #random-phonetic {
                font-size: 20px;
                color: #4a5568;
            }

            .card #random-meaning {
                font-size: 24px;
                color: #2b6cb0;
                margin: 15px 0;
                display: none;
            }

        .btn-group button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 20px;
            background: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .filter-row {
            margin: 10px 0;
            font-size: 16px;
        }

            .filter-row select {
                padding: 6px 12px;
                border-radius: 10px;
                border: 1px solid #ccc;
                font-size: 16px;
            }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

            .action-buttons button {
                padding: 8px 16px;
                border: none;
                border-radius: 20px;
                background: #636e72;
                color: white;
                cursor: pointer;
                font-size: 14px;
            }

                .action-buttons button.export-btn {
                    background: #0984e3;
                }

                .action-buttons button.import-btn {
                    background: #6c5ce7;
                }

        .voice-selector {
            margin: 10px 0;
            font-size: 14px;
        }

            .voice-selector select {
                padding: 6px 10px;
                border-radius: 10px;
                border: 1px solid #ccc;
                font-size: 14px;
            }
        /* 拼写测试样式 */
        .spell-card {
            text-align: center;
            background: #faf5ff;
            border-radius: 16px;
            padding: 30px;
            margin: 20px 0;
        }

        .spell-word-display {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
            color: #2c3e50;
        }

        .spell-phonetic-hint {
            font-size: 18px;
            color: #888;
            margin-bottom: 15px;
        }

        .spell-reveal-box {
            display: none;
            margin: 15px 0;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            border: 2px dashed #b2bec3;
        }

            .spell-reveal-box .eng {
                font-size: 36px;
                font-weight: bold;
                color: #0984e3;
            }

            .spell-reveal-box .chn {
                font-size: 24px;
                color: #2d3436;
                margin-top: 5px;
            }

        .spell-feedback-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

            .spell-feedback-btns button {
                padding: 12px 30px;
                border: none;
                border-radius: 30px;
                font-size: 18px;
                cursor: pointer;
            }

        .btn-remember {
            background: #00b894;
            color: white;
        }

        .btn-forget {
            background: #d63031;
            color: white;
        }

        .spell-stats-box {
            display: none;
            text-align: center;
            background: #dfe6e9;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

            .spell-stats-box h3 {
                margin-top: 0;
            }

            .spell-stats-box ul {
                list-style: none;
                padding: 0;
            }

            .spell-stats-box li {
                font-size: 18px;
                margin: 6px 0;
            }

        .spell-progress {
            font-size: 14px;
            color: #636e72;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 我的单词库</h1>

        <div class="tab-buttons">
            <button class="tablink active" onclick="openTab('listTab')">📋 单词列表</button>
            <button class="tablink" onclick="openTab('randomTab')">🎲 随机背单词</button>
            <button class="tablink" onclick="openTab('spellTab')">✍️ 拼写测试</button>
        </div>

        <!-- 单词列表标签页 -->
        <div id="listTab" class="section active">
            <h3>➕ 添加新单词</h3>
            <div class="add-form">
                <input type="text" id="newWord" placeholder="英文单词" />
                <input type="text" id="newPhonetic" placeholder="音标 /.../" />
                <input type="text" id="newMeaning" placeholder="中文释义" />
                <input type="text" id="newCategory" placeholder="分类（如：基础、科技、日期2026-05-08）" list="categoryList" />
                <datalist id="categoryList"></datalist>
                <button onclick="fetchPhonetic()">🔍 自动获取音标</button>
                <button onclick="addWord()">✅ 添加</button>
            </div>

            <!-- 导出导入按钮行 -->
            <div class="action-buttons">
                <button class="export-btn" onclick="exportWords()">📤 导出单词库</button>
                <button class="import-btn" onclick="importWords()">📥 导入单词库</button>
            </div>

            <h3>📊 所有单词（可按分类筛选）</h3>
            <label>筛选分类：</label>
            <select id="filterCategory" onchange="renderWordList()">
                <option value="">全部</option>
            </select>
            <table id="wordTable">
                <thead>
                    <tr>
                        <th>单词</th>
                        <th>音标</th>
                        <th>释义</th>
                        <th>分类</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 随机背单词标签页 -->
        <div id="randomTab" class="section">
            <div class="card">
                <div class="filter-row">
                    <label>📌 选择范围：</label>
                    <select id="randomCategoryFilter" onchange="onRandomCategoryChange()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div id="random-word"></div>
                <div id="random-phonetic"></div>
                <div id="random-meaning"></div>
                <div class="voice-selector">
                    <label>🎤 发音音色：</label>
                    <select id="voiceSelect" onchange="saveVoicePreference()"></select>
                </div>
                <div class="btn-group">
                    <button onclick="speakRandomWord()">🔊 朗读</button>
                    <button onclick="toggleRandomMeaning()">👀 显示/隐藏释义</button>
                    <button onclick="nextRandomWord()">➡️ 随机下一个</button>
                </div>
            </div>
            <p style="text-align:center; color:#888;">当前范围单词数：<span id="totalCount">0</span></p>
        </div>
        <!-- 拼写测试标签页 -->
        <div id="spellTab" class="section">
            <div class="card spell-card">
                <div class="filter-row">
                    <label>📌 选择范围：</label>
                    <select id="spellCategoryFilter" onchange="onSpellCategoryChange()">
                        <option value="">全部</option>
                    </select>
                </div>
                <button onclick="speakSpellWord()" style="font-size: 24px; padding: 12px 30px; margin: 10px;">🔊 播报单词</button>
                <div class="spell-phonetic-hint" id="spell-phonetic-hint"></div>
                <div class="spell-progress" id="spell-progress"></div>

                <button onclick="revealSpellWord()" style="padding: 10px 25px; margin: 10px;">👀 让我康康</button>

                <div class="spell-reveal-box" id="spell-reveal-box">
                    <div class="eng" id="spell-eng"></div>
                    <div class="chn" id="spell-chn"></div>
                    <div class="spell-feedback-btns">
                        <button class="btn-remember" onclick="markSpellWord('remember')">🍗 酱味大鸡</button>
                        <button class="btn-forget" onclick="markSpellWord('forget')">❓ 真的假的</button>
                    </div>
                </div>

                <p style="margin-top: 10px;">
                    <button onclick="finishSpellTest()" style="background: #636e72; color: white; padding: 10px 25px; border: none; border-radius: 20px; font-size: 16px;">🏁 结束测试</button>
                </p>
            </div>

            <div class="spell-stats-box" id="spell-stats-box">
                <h3>📊 本次测试统计</h3>
                <p>复习单词数：<span id="spell-total"></span></p>
                <p>记忆困难单词：</p>
                <ul id="spell-difficult-list"></ul>
                <button onclick="restartSpellTest()" style="padding: 8px 20px; border: none; border-radius: 20px; background: #0984e3; color: white; cursor: pointer;">🔄 再来一组</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- 数据管理 ----------
        let words = JSON.parse(localStorage.getItem('myVocabWords')) || [];

        function saveWords() {
            localStorage.setItem('myVocabWords', JSON.stringify(words));
        }

        // 初始化示例单词
        if (words.length === 0) {
            words = [
                { word: "apple", phonetic: "/ˈæp.əl/", meaning: "苹果", category: "水果", date: "2026-05-08" },
                { word: "book", phonetic: "/bʊk/", meaning: "书", category: "日常", date: "2026-05-08" },
                { word: "cat", phonetic: "/kæt/", meaning: "猫", category: "动物", date: "2026-05-07" }
            ];
            saveWords();
        }

        // ---------- 记忆上次分类 ----------
        // 页面加载时恢复上次使用的分类
        const lastCategory = localStorage.getItem('lastCategory') || '';
        document.getElementById('newCategory').value = lastCategory;

        // 保存当前分类到本地存储
        function saveLastCategory(cat) {
            localStorage.setItem('lastCategory', cat);
        }

        // ---------- 语音管理（音色选择） ----------
        let availableVoices = [];
        let selectedVoice = null;

        function loadVoices() {
            availableVoices = speechSynthesis.getVoices();
            const select = document.getElementById('voiceSelect');
            if (!select) return;

            const enVoices = availableVoices.filter(v => v.lang.startsWith('en'));
            select.innerHTML = '';
            enVoices.forEach((voice, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = `${voice.name} (${voice.lang})`;
                select.appendChild(option);
            });

            const savedVoiceURI = localStorage.getItem('preferredVoiceURI');
            if (savedVoiceURI) {
                const savedIdx = enVoices.findIndex(v => v.voiceURI === savedVoiceURI);
                if (savedIdx >= 0) {
                    select.value = savedIdx;
                    selectedVoice = enVoices[savedIdx];
                }
            } else if (enVoices.length > 0) {
                selectedVoice = enVoices[0];
                select.value = 0;
            }
        }

        speechSynthesis.onvoiceschanged = loadVoices;
        window.onload = () => {
            loadVoices();
            renderWordList();
            nextRandomWord();
            updateRandomTotal();
        };

        function saveVoicePreference() {
            const select = document.getElementById('voiceSelect');
            const enVoices = availableVoices.filter(v => v.lang.startsWith('en'));
            const idx = parseInt(select.value);
            if (enVoices[idx]) {
                selectedVoice = enVoices[idx];
                localStorage.setItem('preferredVoiceURI', selectedVoice.voiceURI);
            }
        }

        function speakWordText(text) {
            if (!text) return;

            // 必须先取消，防止旧声音残留导致新声音被拦截
            speechSynthesis.cancel();

            // 强制恢复音频上下文（解决某些版本的暂停状态）
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
            }

            // 等待微任务完成，确保 cancel 彻底生效后再创建新语音
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.volume = 1;

                // 应用用户选择的音色
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                } else {
                    const enVoices = availableVoices.filter(v => v.lang.startsWith('en'));
                    const preferred = enVoices.find(v => v.name.includes('Female') || v.name.includes('Samantha')) || enVoices[0];
                    if (preferred) utterance.voice = preferred;
                }

                speechSynthesis.speak(utterance);
            }, 10); // 10毫秒延迟足以让 cancel 完成，同时保持“用户点击”的有效窗口
        }

        // ---------- 自动获取音标（增强版） ----------
        async function fetchPhonetic() {
            const word = document.getElementById('newWord').value.trim();
            if (!word) { alert('请先输入英文单词'); return; }
            const phoneticInput = document.getElementById('newPhonetic');
            phoneticInput.value = '查询中...';

            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                const data = await response.json();
                if (data && Array.isArray(data) && data[0]) {
                    const phonetic = data[0].phonetic ||
                        (data[0].phonetics && data[0].phonetics[0] && data[0].phonetics[0].text);
                    if (phonetic) {
                        phoneticInput.value = phonetic;
                        return;
                    }
                }
            } catch (e) { }

            try {
                const backupResponse = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word.toLowerCase()}`);
                const backupData = await backupResponse.json();
                if (backupData && Array.isArray(backupData) && backupData[0]) {
                    const phonetic = backupData[0].phonetic ||
                        (backupData[0].phonetics && backupData[0].phonetics[0] && backupData[0].phonetics[0].text);
                    if (phonetic) {
                        phoneticInput.value = phonetic;
                        return;
                    }
                }
            } catch (e) { }

            phoneticInput.value = '未找到音标，请手动输入';
        }

        // 添加单词（不清空分类框，并记忆分类）
        function addWord() {
            const w = document.getElementById('newWord').value.trim();
            const p = document.getElementById('newPhonetic').value.trim();
            const m = document.getElementById('newMeaning').value.trim();
            let c = document.getElementById('newCategory').value.trim();
            if (!w || !m) { alert('单词和释义不能为空'); return; }
            if (!c) {
                const today = new Date().toISOString().slice(0, 10);
                c = today;
            }
            words.push({
                word: w,
                phonetic: p || '/ /',
                meaning: m,
                category: c,
                date: new Date().toISOString().slice(0, 10)
            });
            saveWords();

            // 清空单词、音标、释义，但保留分类框
            document.getElementById('newWord').value = '';
            document.getElementById('newPhonetic').value = '';
            document.getElementById('newMeaning').value = '';
            // 不重置分类，同时保存当前分类到本地存储
            saveLastCategory(document.getElementById('newCategory').value);

            renderWordList();
            updateRandomCategoryFilter();
            updateRandomTotal();
        }

        // 删除单词
        function deleteWord(index) {
            if (confirm('确定删除吗？')) {
                words.splice(index, 1);
                saveWords();
                renderWordList();
                updateRandomCategoryFilter();
                updateRandomTotal();
            }
        }

        // 导出单词库
        function exportWords() {
            const dataStr = JSON.stringify(words, null, 2);
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
            modal.innerHTML = `
                <div style="background:white;padding:20px;border-radius:16px;max-width:600px;width:90%;max-height:80vh;display:flex;flex-direction:column;">
                    <h3>📤 导出单词库</h3>
                    <p style="font-size:14px;color:#555;">点击下方文本区域会自动全选，按 Ctrl+C 复制，然后发给别人或保存到记事本。</p>
                    <textarea id="exportTextarea" readonly style="flex:1;min-height:200px;font-family:monospace;padding:10px;border-radius:8px;border:1px solid #ccc;">${dataStr}</textarea>
                    <div style="margin-top:10px;text-align:right;">
                        <button onclick="this.closest('.fixed').remove()" style="padding:8px 20px;border:none;border-radius:20px;background:#636e72;color:white;cursor:pointer;">关闭</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                const textarea = document.getElementById('exportTextarea');
                if (textarea) {
                    textarea.select();
                    textarea.setSelectionRange(0, 99999);
                }
            }, 100);
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        // 导入单词库
        function importWords() {
            const dataStr = prompt('请将之前导出的单词库文本粘贴到这里：');
            if (!dataStr) return;
            try {
                const parsed = JSON.parse(dataStr);
                if (!Array.isArray(parsed)) throw new Error('格式错误');
                const isValid = parsed.every(item => item.word && item.meaning);
                if (!isValid) {
                    alert('导入的数据格式不正确，请确保包含 word 和 meaning 字段。');
                    return;
                }
                if (confirm(`即将导入 ${parsed.length} 个单词，是否覆盖当前所有单词？\n（点“确定”覆盖，点“取消”放弃）`)) {
                    words = parsed;
                    saveWords();
                    renderWordList();
                    updateRandomCategoryFilter();
                    updateRandomTotal();
                    alert('导入成功！');
                }
            } catch (e) {
                alert('数据格式有误，请检查后重试。');
            }
        }

        // 渲染单词列表
        function renderWordList() {
            const filter = document.getElementById('filterCategory').value;
            const filtered = filter ? words.filter(w => w.category === filter) : words;
            const tbody = document.querySelector('#wordTable tbody');
            tbody.innerHTML = '';
            filtered.forEach((w, idx) => {
                const originalIndex = words.indexOf(w);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${w.word}</strong></td>
                    <td>${w.phonetic}</td>
                    <td>${w.meaning}</td>
                    <td><span class="category-badge">${w.category}</span></td>
                    <td>
                        <button class="play-btn" onclick="speakWordText('${w.word.replace(/'/g, "\\'")}')">🔊</button>
                        <button class="delete-btn" onclick="deleteWord(${originalIndex})">🗑</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const categories = [...new Set(words.map(w => w.category))];
            const filterSelect = document.getElementById('filterCategory');
            const currentFilter = filterSelect.value;
            filterSelect.innerHTML = '<option value="">全部</option>';
            categories.forEach(cat => {
                filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            filterSelect.value = currentFilter;

            const datalist = document.getElementById('categoryList');
            datalist.innerHTML = '';
            categories.forEach(cat => {
                datalist.innerHTML += `<option value="${cat}">`;
            });
            updateRandomCategoryFilter();
        }

        function updateRandomCategoryFilter() {
            const select = document.getElementById('randomCategoryFilter');
            const currentVal = select.value;
            const categories = [...new Set(words.map(w => w.category))];
            select.innerHTML = '<option value="">全部</option>';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            if (categories.includes(currentVal)) {
                select.value = currentVal;
            } else {
                select.value = '';
            }
            updateRandomTotal();
        }

        function getRandomWordList() {
            const cat = document.getElementById('randomCategoryFilter').value;
            if (!cat) return words;
            return words.filter(w => w.category === cat);
        }

        function onRandomCategoryChange() {
            const list = getRandomWordList();
            if (list.length === 0) {
                alert('该分类下没有单词，已切换为“全部”');
                document.getElementById('randomCategoryFilter').value = '';
            }
            nextRandomWord();
            updateRandomTotal();
        }

        // 随机背单词模块
        // 拼写测试模块
        let spellWordList = [];          // 当前测试范围的单词列表
        let spellCurrent = null;        // 当前测的单词
        let spellErrorQueue = [];       // 错题队列（单词对象）
        let spellCompletedCount = 0;    // 已完成测试的单词数（用于统计）
        let spellDifficultWords = [];   // 记录困难单词（原始对象）
        let spellTestActive = false;    // 是否正在进行测试
        let randomCurrent = null;

        function nextRandomWord() {
            const list = getRandomWordList();
            if (list.length === 0) {
                document.getElementById('random-word').innerText = '请先添加单词';
                document.getElementById('random-phonetic').innerText = '';
                document.getElementById('random-meaning').style.display = 'none';
                return;
            }
            const randomIndex = Math.floor(Math.random() * list.length);
            randomCurrent = list[randomIndex];
            document.getElementById('random-word').innerText = randomCurrent.word;
            document.getElementById('random-phonetic').innerText = randomCurrent.phonetic;
            document.getElementById('random-meaning').style.display = 'none';
        }

        function speakRandomWord() {
            if (!randomCurrent) return;
            speakWordText(randomCurrent.word);
        }

        function toggleRandomMeaning() {
            const meaningDiv = document.getElementById('random-meaning');
            if (!randomCurrent) return;
            meaningDiv.innerText = randomCurrent.meaning;
            meaningDiv.style.display = meaningDiv.style.display === 'none' ? 'block' : 'none';
        }

        function updateRandomTotal() {
            const list = getRandomWordList();
            document.getElementById('totalCount').innerText = list.length;
        }

        function openTab(tabName) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tablink').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            if (tabName === 'listTab') {
                document.querySelector('.tablink:first-child').classList.add('active');
                renderWordList();
            } else if (tabName === 'randomTab') {
                document.querySelectorAll('.tablink')[1].classList.add('active');
                updateRandomCategoryFilter();
                nextRandomWord();
                updateRandomTotal();
            } else if (tabName === 'spellTab') {
                document.querySelectorAll('.tablink')[2].classList.add('active');
                initSpellTab();
            }
            loadVoices();
        }
     

        // 启动
        renderWordList();
        nextRandomWord();
        updateRandomTotal();
        // ========== 拼写测试模块 ==========

        function updateSpellCategoryFilter() {
            const select = document.getElementById('spellCategoryFilter');
            if (!select) return;
            const currentVal = select.value;
            const categories = [...new Set(words.map(w => w.category))];
            select.innerHTML = '<option value="">全部</option>';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
            if (categories.includes(currentVal)) select.value = currentVal;
            else select.value = '';
        }

        function getSpellWordList() {
            const cat = document.getElementById('spellCategoryFilter').value;
            return cat ? words.filter(w => w.category === cat) : [...words];
        }

        function resetSpellTest() {
            spellWordList = getSpellWordList();
            spellErrorQueue = [];
            spellCompletedCount = 0;
            spellDifficultWords = [];
            spellTestActive = true;
            spellCurrent = null;
            document.getElementById('spell-reveal-box').style.display = 'none';
            document.getElementById('spell-stats-box').style.display = 'none';
            document.getElementById('spell-progress').innerText = '';
            if (spellWordList.length === 0) {
                alert('当前分类无单词');
                spellTestActive = false;
                return;
            }
            nextSpellWord();
        }

        function nextSpellWord() {
            if (!spellTestActive) return;
            // 错题优先逻辑：概率60%，且错题队列至少两个词
            if (spellErrorQueue.length > 1 && Math.random() < 0.6) {
                let candidate = spellErrorQueue[0];
                if (spellCurrent && candidate.word === spellCurrent.word && spellErrorQueue.length > 1) {
                    candidate = spellErrorQueue[1];
                }
                spellCurrent = candidate;
            } else {
                const idx = Math.floor(Math.random() * spellWordList.length);
                spellCurrent = spellWordList[idx];
            }
            document.getElementById('spell-phonetic-hint').innerText = spellCurrent.phonetic;
            document.getElementById('spell-reveal-box').style.display = 'none';
            document.getElementById('spell-progress').innerText = `已复习：${spellCompletedCount} 词  |  错题库：${spellErrorQueue.length} 词`;
        }

        function speakSpellWord() {
            if (!spellTestActive || !spellCurrent) alert('请开始测试');
            else speakWordText(spellCurrent.word);
        }

        function revealSpellWord() {
            if (!spellTestActive || !spellCurrent) return;
            document.getElementById('spell-eng').innerText = spellCurrent.word;
            document.getElementById('spell-chn').innerText = spellCurrent.meaning;
            document.getElementById('spell-reveal-box').style.display = 'block';
        }

        function markSpellWord(result) {
            if (!spellTestActive || !spellCurrent) return;
            if (result === 'remember') {
                spellErrorQueue = spellErrorQueue.filter(w => w.word !== spellCurrent.word);
            } else {
                if (!spellErrorQueue.some(w => w.word === spellCurrent.word)) {
                    spellErrorQueue.push(spellCurrent);
                }
                if (!spellDifficultWords.some(w => w.word === spellCurrent.word)) {
                    spellDifficultWords.push(spellCurrent);
                }
            }
            spellCompletedCount++;
            nextSpellWord();
        }

        function finishSpellTest() {
            spellTestActive = false;
            document.getElementById('spell-stats-box').style.display = 'block';
            document.getElementById('spell-total').innerText = spellCompletedCount;
            const diffList = document.getElementById('spell-difficult-list');
            diffList.innerHTML = '';
            if (spellDifficultWords.length === 0) {
                diffList.innerHTML = '<li>🎉 全部记住，太强了！</li>';
            } else {
                spellDifficultWords.forEach(w => {
                    diffList.innerHTML += `<li>${w.word} (${w.meaning})</li>`;
                });
            }
            document.getElementById('spell-progress').innerText = '';
        }

        function restartSpellTest() {
            spellErrorQueue = [];
            spellCompletedCount = 0;
            spellDifficultWords = [];
            spellTestActive = true;
            spellCurrent = null;
            document.getElementById('spell-stats-box').style.display = 'none';
            nextSpellWord();
        }

        function onSpellCategoryChange() {
            resetSpellTest();
        }

        function initSpellTab() {
            updateSpellCategoryFilter();
            resetSpellTest();
        }
    </script>
</body>
</html>
